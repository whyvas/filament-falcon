; The Filament Falcon - ESP32-S3 cockpit firmware
; One codebase, three boards. Build all:   pio run
; Build one:   pio run -e falcon_pilot      Flash: pio run -e falcon_pilot -t upload
;
; USB IDs: 0x1209 is the pid.codes open-source VID. PIDs 0x0003/0x0004/0x0005 are
; pid.codes "Test PIDs" reserved for private in-house use. They are fine for a home
; cockpit but are NOT globally unique; do not ship/sell devices with them.

[platformio]
default_envs = falcon_pilot, falcon_ops, falcon_command

[env]
platform = espressif32@7.1.3   ; ships Arduino-ESP32 core 2.0.17
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; TinyUSB (OTG) stack on the native USB port instead of the HW CDC/JTAG.
; CDC-on-boot is off: we add HID (and CDC for Command) ourselves before USB.begin().
board_build.extra_flags =
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -DFF_USB_VID=0x1209
  -DFF_USB_MANUFACTURER=\"Filament\ Falcon\"
  -DFF_FW_VERSION=\"0.1.0\"
extra_scripts = pre:tools/gen_led_map.py

[env:falcon_pilot]
build_flags =
  ${env.build_flags}
  -DFF_BOARD_PILOT
  -DFF_USB_PID=0x0003
  -DFF_USB_PRODUCT=\"Falcon\ Pilot\"
  -DFF_USB_SERIAL=\"FF-PILOT\"

[env:falcon_ops]
build_flags =
  ${env.build_flags}
  -DFF_BOARD_OPS
  -DFF_USB_PID=0x0004
  -DFF_USB_PRODUCT=\"Falcon\ Ops\"
  -DFF_USB_SERIAL=\"FF-OPS\"

[env:falcon_command]
build_flags =
  ${env.build_flags}
  -DFF_BOARD_COMMAND
  -DFF_USB_PID=0x0005
  -DFF_USB_PRODUCT=\"Falcon\ Command\"
  -DFF_USB_SERIAL=\"FF-COMMAND\"
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3

; Joystick-only test build: identical to Pilot but ignores the shift-register
; chain and encoders completely. Flash this to test ONE joystick wired straight
; to the board (see docs/electronics/01_simple_joystick.png).
[env:falcon_joystick_test]
build_flags =
  ${env.build_flags}
  -DFF_BOARD_PILOT
  -DFF_FORCE_FALLBACK=1
  -DFF_USB_PID=0x0003
  -DFF_USB_PRODUCT=\"Falcon\ Pilot\"
  -DFF_USB_SERIAL=\"FF-PILOT-TEST\"
